<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Market Command Center — UX Preview</title>
  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#f6f3ed}body{overflow:hidden}</style>
</head>
<body>
  <iframe id="app" src="Index.html?demo=1" title="Hà Tiên Market Command Center"></iframe>
  <script>
    const screen=new URLSearchParams(location.search).get('screen')||'overview';
    const allowed=['overview','decisions','decided','publish'];
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      const target=allowed.includes(screen)?screen:'overview';
      const button=frame.contentDocument.querySelector(`[data-screen="${target}"]`);
      if(button)button.click();
    });
  </script>
</body>
</html>
