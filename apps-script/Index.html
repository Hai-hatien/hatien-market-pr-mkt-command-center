<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <title>Hà Tiên — Market Command Center</title>
  <style>
    :root{
      --bg:#f6f3ed;--card:#fff;--text:#1d1c1a;--muted:#68645d;--line:#e5ded2;
      --gold:#b48747;--soft:#eee7da;--danger:#8b3030;--danger-bg:#f7eaea;
      --ok:#285c3d;--shadow:0 8px 26px rgba(31,25,16,.055)
    }
    *{box-sizing:border-box}
    html{background:var(--bg);color-scheme:light;overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    button,input,textarea{font:inherit}
    button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(180,135,71,.45);outline-offset:2px}
    .app{width:min(100%,680px);min-height:100vh;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
    .top{position:sticky;top:0;z-index:5;margin:0 -2px;padding:17px 2px 11px;background:rgba(246,243,237,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(229,222,210,.85)}
    .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#806236;font-weight:800}
    .top h1{margin:5px 0 3px;font-size:25px;line-height:1.16}
    .sub{font-size:13px;color:var(--muted);line-height:1.45}
    .screen{display:none;padding-top:14px}
    .screen.active{display:block}
    .hero{padding:17px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow-wrap:anywhere}
    .hero .big{font-size:33px;line-height:1;font-weight:850}
    .hero p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}
    .metric{min-width:0;padding:11px 6px;background:var(--soft);border-radius:13px;text-align:center}
    .metric strong{display:block;font-size:20px}
    .metric span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.25}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:20px 2px 10px}
    .section-title h2{margin:0;font-size:18px;line-height:1.25}
    .section-title span{color:var(--muted);font-size:11px;text-align:right}
    .list{display:grid;gap:10px}
    .card{min-width:0;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px rgba(31,25,16,.035);overflow-wrap:anywhere}
    .card h3{margin:0 0 8px;font-size:17px;line-height:1.36}
    .tag{display:inline-flex;align-items:center;margin-bottom:8px;padding:5px 8px;border-radius:999px;background:var(--soft);color:#5c4b30;font-size:10px;font-weight:700}
    .tag.scheduled{background:#e8f1eb;color:var(--ok)}
    .meta{margin-bottom:8px;color:var(--muted);font-size:12px;line-height:1.4;overflow-wrap:anywhere}
    .body{color:#37342f;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .body+.body{margin-top:6px}
    .recommend{margin-top:10px;padding:10px 11px;background:#faf7f0;border-left:3px solid var(--gold);border-radius:8px;color:#403a31;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
    .source{display:inline-block;max-width:100%;margin-top:10px;color:#715522;font-size:12px;text-decoration:none;overflow-wrap:anywhere}
    .source:after{content:' ↗'}
    .actions,.publish-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .btn{min-width:0;min-height:48px;border:0;border-radius:13px;padding:11px 12px;font-weight:750;cursor:pointer;line-height:1.25}
    .btn.primary{background:var(--text);color:#fff}
    .btn.gold{background:var(--gold);color:#fff}
    .btn.soft{background:var(--soft);color:var(--text)}
    .btn.danger{background:var(--danger-bg);color:var(--danger)}
    .btn:disabled{opacity:.5;cursor:wait}
    .schedule-box{display:none;margin-top:10px;padding:11px;background:#faf7f0;border:1px solid #eee4d3;border-radius:13px}
    .schedule-box.open{display:block}
    .schedule-site{margin-bottom:9px;color:#4f493f;font-size:12px;line-height:1.4}
    .schedule-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .schedule-row>*{min-width:0}
    .field{width:100%;min-width:0;min-height:46px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
    textarea.field{min-height:70px;margin-top:8px;resize:vertical}
    .schedule-confirm{width:100%;margin-top:8px}
    .scheduled-time{margin-top:4px;font-size:14px;font-weight:750}
    .empty{padding:27px 17px;background:var(--card);border:1px dashed #d6cfc3;border-radius:18px;color:var(--muted);font-size:14px;line-height:1.5;text-align:center}
    .loading{padding:36px 0;color:var(--muted);text-align:center}
    .bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
    .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:min(680px,100%)}
    .nav button{min-width:0;min-height:54px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:10px;line-height:1.15}
    .nav button b{display:block;margin-bottom:4px;font-size:18px;line-height:1}
    .nav button.active{background:var(--soft);color:var(--text);font-weight:750}
    .toast{position:fixed;z-index:20;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));max-width:calc(100vw - 28px);padding:11px 14px;transform:translateX(-50%);border-radius:12px;background:#171717;color:#fff;font-size:13px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .18s}
    .toast.show{opacity:1}
    .error{padding:18px;border:1px solid #ead1d1;border-radius:16px;background:#fff6f6;color:#773333;font-size:14px;line-height:1.5}
    @media (max-width:380px){
      .app{padding-left:12px;padding-right:12px}
      .top h1{font-size:23px}
      .schedule-row{grid-template-columns:1fr}
      .publish-actions{grid-template-columns:1fr}
    }
    @media (min-width:700px){
      .app{padding-left:20px;padding-right:20px}
      .top h1{font-size:29px}
      .actions,.publish-actions{grid-template-columns:repeat(4,1fr)}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="eyebrow">Hà Tiên · Thị trường & nội dung</div>
    <h1 id="greeting">Chào anh Hải</h1>
    <div class="sub" id="generated">Đang lấy dữ liệu mới nhất…</div>
  </header>

  <main>
    <section id="screen-overview" class="screen active" aria-labelledby="overview-heading">
      <div id="overview-loading" class="loading">Đang tổng hợp sáng nay…</div>
      <div id="overview-content" hidden>
        <div class="hero">
          <div class="big" id="overview-total">0</div>
          <p id="overview-summary">Sáng nay chưa có việc nào cần anh Hải quyết định.</p>
          <div class="metrics">
            <div class="metric"><strong id="metric-decisions">0</strong><span>Cần quyết định</span></div>
            <div class="metric"><strong id="metric-publish">0</strong><span>Chờ duyệt đăng</span></div>
            <div class="metric"><strong id="metric-scheduled">0</strong><span>Đã lên lịch</span></div>
          </div>
        </div>
        <div class="section-title"><h2 id="overview-heading">Đáng chú ý sáng nay</h2><span id="signal-count"></span></div>
        <div id="signals-list" class="list"></div>
      </div>
    </section>

    <section id="screen-decisions" class="screen" aria-labelledby="decision-heading">
      <div class="section-title"><h2 id="decision-heading">Việc cần anh quyết định</h2><span id="decision-count"></span></div>
      <div id="decisions-list" class="list"></div>
    </section>

    <section id="screen-publish" class="screen" aria-labelledby="publish-heading">
      <div class="section-title"><h2 id="publish-heading">Bài chờ đăng / lịch đăng</h2><span id="publish-count"></span></div>
      <div id="publish-pending-list" class="list"></div>
      <div id="scheduled-heading" class="section-title" hidden><h2>Đã lên lịch</h2><span id="scheduled-count"></span></div>
      <div id="scheduled-list" class="list"></div>
    </section>
  </main>
</div>

<nav class="bottom" aria-label="Điều hướng chính">
  <div class="nav">
    <button class="active" data-screen="overview" aria-label="Tổng quan"><b aria-hidden="true">⌂</b>Tổng quan</button>
    <button data-screen="decisions" aria-label="Việc cần quyết định"><b aria-hidden="true">✓</b>Cần quyết định</button>
    <button data-screen="publish" aria-label="Bài chờ đăng và lịch đăng"><b aria-hidden="true">◷</b>Chờ đăng</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  const state={model:null,busy:false};
  const $=s=>document.querySelector(s);
  const $$=s=>Array.from(document.querySelectorAll(s));
  const esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const ownerText=s=>String(s??'')
    .replace(/\bPENDING_G0_G7\b/gi,'đang chờ kiểm tra')
    .replace(/\bPENDING_G[0-8]\b/gi,'đang chờ kiểm tra')
    .replace(/\bACT_NOW\b:?/g,'Nên làm ngay')
    .replace(/\bWATCH\b:?/g,'Theo dõi thêm')
    .replace(/\bRESEARCH_MORE\b:?/g,'Nghiên cứu thêm')
    .replace(/\bIGNORE\b:?/g,'Bỏ qua')
    .replace(/\bSOURCE_VERIFIED\b/gi,'đã xác minh nguồn')
    .replace(/\bG[0-8]\b/g,'AI')
    .replace(/\bclaim\b/gi,'nội dung cần kiểm chứng')
    .replace(/\bgate\b/gi,'bước kiểm tra')
    .replace(/\bRun ID\b/gi,'')
    .replace(/\s{2,}/g,' ')
    .trim();
  const vi=ownerText;
  const link=(url,label)=>!url||!/^https?:\/\//i.test(url)?'':`<a class="source" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(ownerText(label||'Xem nguồn'))}</a>`;
  const fmtTime=s=>{if(!s)return'';try{return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}catch(_){return String(s)}};
  const fmtPublish=s=>{if(!s)return'';try{return new Intl.DateTimeFormat('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}catch(_){return String(s)}};

  function switchScreen(name){
    $$('.screen').forEach(x=>x.classList.toggle('active',x.id===`screen-${name}`));
    $$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));
    window.scrollTo({top:0,behavior:'smooth'});
  }
  $$('.nav button').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));

  function render(model){
    state.model=model||{};
    const o=state.model.overview||{};
    $('#greeting').textContent=ownerText(state.model.greeting||'Chào anh Hải');
    $('#generated').textContent=state.model.generated_at?'Cập nhật '+fmtTime(state.model.generated_at):'Dữ liệu mới nhất';
    $('#overview-total').textContent=(o.needs_decision||0)+(o.waiting_publish||0);
    $('#overview-summary').textContent=ownerText(o.summary||'Sáng nay chưa có việc nào cần anh Hải quyết định.');
    $('#metric-decisions').textContent=o.needs_decision||0;
    $('#metric-publish').textContent=o.waiting_publish||0;
    $('#metric-scheduled').textContent=o.scheduled_publish||0;
    $('#overview-loading').hidden=true;
    $('#overview-content').hidden=false;
    renderSignals(state.model.signals||[]);
    renderDecisions(state.model.decisions||[]);
    renderPublish(state.model.publish||[],state.model.scheduled||[]);
  }

  function renderSignals(items){
    $('#signal-count').textContent=items.length?items.length+' tín hiệu':'';
    const el=$('#signals-list');
    if(!items.length){
      el.innerHTML='<div class="empty">Chưa có tín hiệu mới đáng chú ý trong khoảng thời gian gần đây.</div>';
      return;
    }
    el.innerHTML=items.map(x=>`<article class="card"><div class="tag">Tín hiệu thị trường</div><h3>${esc(ownerText(x.title))}</h3>${x.detail?`<div class="body">${esc(ownerText(x.detail))}</div>`:''}${x.recommendation?`<div class="recommend"><b>Đề xuất:</b> ${esc(vi(x.recommendation))}</div>`:''}${link(x.source_url,x.source_title||'Xem nguồn')}</article>`).join('');
  }

  function renderDecisions(items){
    $('#decision-count').textContent=items.length?items.length+' việc':'';
    const el=$('#decisions-list');
    if(!items.length){
      el.innerHTML='<div class="empty">Không có việc nào đang chờ anh quyết định.</div>';
      return;
    }
    el.innerHTML=items.map((x,i)=>`<article class="card"><div class="tag">Có nên làm / viết không?</div><h3>${esc(ownerText(x.title))}</h3>${x.why_now?`<div class="body"><b>Vì sao cần xem lúc này:</b> ${esc(ownerText(x.why_now))}</div>`:''}${x.evidence_summary?`<div class="body"><b>Căn cứ:</b> ${esc(ownerText(x.evidence_summary))}</div>`:''}${x.value_summary?`<div class="body"><b>Giá trị dự kiến:</b> ${esc(ownerText(x.value_summary))}</div>`:''}${x.risk_summary?`<div class="body"><b>Cần lưu ý:</b> ${esc(ownerText(x.risk_summary))}</div>`:''}${x.recommendation?`<div class="recommend"><b>Đề xuất:</b> ${esc(vi(x.recommendation))}</div>`:''}${link(x.source_url,x.source_title||'Xem căn cứ')}<div class="actions"><button class="btn primary" data-action="decision" data-index="${i}" data-value="DONG_Y">Đồng ý làm</button><button class="btn soft" data-action="decision" data-index="${i}" data-value="NGHIEN_CUU_THEM">Nghiên cứu thêm</button><button class="btn soft" data-action="decision" data-index="${i}" data-value="TAM_HOAN">Tạm hoãn</button><button class="btn danger" data-action="decision" data-index="${i}" data-value="KHONG_LAM">Không làm</button></div></article>`).join('');
  }

  function renderPublish(pending,scheduled){
    $('#publish-count').textContent=pending.length||scheduled.length?(pending.length+' chờ duyệt · '+scheduled.length+' đã lên lịch'):'';
    const pendingEl=$('#publish-pending-list');
    if(!pending.length){
      pendingEl.innerHTML='<div class="empty">Không có bài nào đang chờ anh duyệt đăng.</div>';
    }else{
      pendingEl.innerHTML=pending.map((x,i)=>`<article class="card"><div class="tag">Có cho xuất bản không?</div><h3>${esc(ownerText(x.title))}</h3><div class="meta">${esc(x.target_site||'Website Hà Tiên')}</div>${x.why_now?`<div class="body">${esc(ownerText(x.why_now))}</div>`:''}${x.preview_url?link(x.preview_url,'Xem bản xem trước'):''}<div class="publish-actions"><button class="btn primary" data-action="publish" data-index="${i}" data-value="DANG_NGAY">Đăng ngay</button><button class="btn gold" data-action="open-schedule" data-index="${i}">Lên lịch đăng</button><button class="btn soft" data-action="publish" data-index="${i}" data-value="SUA_LAI">Sửa lại</button><button class="btn danger" data-action="publish" data-index="${i}" data-value="KHONG_DANG">Không đăng</button></div><div class="schedule-box" id="schedule-${i}"><div class="schedule-site"><b>Sẽ đăng trên:</b> ${esc(x.target_site||'Website Hà Tiên')}</div><div class="schedule-row"><input class="field" id="date-${i}" type="date" aria-label="Ngày đăng"><input class="field" id="time-${i}" type="time" value="09:00" aria-label="Giờ đăng"></div><textarea class="field" id="note-${i}" placeholder="Ghi chú nếu cần" aria-label="Ghi chú lịch đăng"></textarea><button class="btn gold schedule-confirm" data-action="confirm-schedule" data-index="${i}">Xác nhận lịch đăng</button></div></article>`).join('');
    }

    $('#scheduled-heading').hidden=!scheduled.length;
    $('#scheduled-count').textContent=scheduled.length?scheduled.length+' bài':'';
    const scheduledEl=$('#scheduled-list');
    scheduledEl.innerHTML=scheduled.map(x=>`<article class="card"><div class="tag scheduled">Đã lên lịch</div><h3>${esc(ownerText(x.title))}</h3><div class="meta">${esc(x.target_site||'Website Hà Tiên')}</div><div class="scheduled-time">${esc(fmtPublish(x.publish_at))}</div>${x.owner_note?`<div class="body">${esc(ownerText(x.owner_note))}</div>`:''}${x.preview_url?link(x.preview_url,'Xem bản xem trước'):''}</article>`).join('');
  }

  document.addEventListener('click',e=>{
    const b=e.target.closest('button[data-action]');
    if(!b)return;
    const i=Number(b.dataset.index||0);
    const action=b.dataset.action;
    if(action==='decision'){
      const item=(state.model.decisions||[])[i];
      if(item)decide(item,b.dataset.value);
    }
    if(action==='publish'){
      const item=(state.model.publish||[])[i];
      if(item)decide(item,b.dataset.value);
    }
    if(action==='open-schedule'){
      const box=$('#schedule-'+i);
      if(box){box.classList.toggle('open');setScheduleMin(i)}
    }
    if(action==='confirm-schedule')schedule(i);
  });

  function localDateParts(date){
    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,'0');
    const d=String(date.getDate()).padStart(2,'0');
    const hh=String(date.getHours()).padStart(2,'0');
    const mm=String(date.getMinutes()).padStart(2,'0');
    return{date:`${y}-${m}-${d}`,time:`${hh}:${mm}`};
  }

  function setScheduleMin(i){
    const dateField=$('#date-'+i);
    const timeField=$('#time-'+i);
    if(!dateField||!timeField)return;
    const now=new Date();
    const parts=localDateParts(now);
    dateField.min=parts.date;
    if(!dateField.value)dateField.value=parts.date;
    timeField.min=dateField.value===parts.date?parts.time:'';
    dateField.onchange=()=>{
      const fresh=localDateParts(new Date());
      timeField.min=dateField.value===fresh.date?fresh.time:'';
      if(timeField.min&&timeField.value<timeField.min)timeField.value=timeField.min;
    };
    if(timeField.min&&timeField.value<timeField.min)timeField.value=timeField.min;
  }

  function schedule(i){
    const item=(state.model.publish||[])[i];
    if(!item)return;
    const d=$('#date-'+i).value;
    const t=$('#time-'+i).value;
    if(!d||!t){toast('Vui lòng chọn ngày và giờ đăng.');return}
    const publishDate=new Date(d+'T'+t);
    if(isNaN(publishDate.getTime())){toast('Ngày giờ đăng chưa hợp lệ.');return}
    if(publishDate.getTime()<Date.now()-60000){toast('Không thể lên lịch ở thời điểm đã qua.');return}
    decide(item,'LEN_LICH_DANG',d+'T'+t,$('#note-'+i).value);
  }

  function decide(item,value,publishAt,note){
    if(state.busy)return;
    state.busy=true;
    $$('.btn').forEach(b=>b.disabled=true);
    const payload={
      source:item.source,
      row_number:item.row_number,
      record_id:item.record_id||'',
      decision_type:item.decision_type,
      decision_value:value,
      publish_at:publishAt||'',
      note:note||''
    };
    if(window.google&&google.script&&google.script.run){
      google.script.run
        .withSuccessHandler(res=>{state.busy=false;toast((res&&res.message)||'Đã lưu quyết định.');load()})
        .withFailureHandler(err=>{state.busy=false;$$('.btn').forEach(b=>b.disabled=false);toast(ownerText((err&&err.message)||'Không lưu được. Vui lòng thử lại.'))})
        .saveMarketOwnerDecision(payload);
    }else{
      state.busy=false;
      toast('Bản xem trước: đã mô phỏng lưu quyết định.');
      demoApply(item,value,publishAt,note);
    }
  }

  function demoApply(item,value,publishAt,note){
    if(!state.model)return;
    if(item.decision_type==='PUBLISH'){
      state.model.publish=state.model.publish.filter(x=>x!==item);
      if(value==='LEN_LICH_DANG'){
        state.model.scheduled=[...(state.model.scheduled||[]),{...item,publish_at:publishAt,owner_note:note||''}];
      }
    }else{
      state.model.decisions=state.model.decisions.filter(x=>x!==item);
    }
    state.model.overview.needs_decision=state.model.decisions.length;
    state.model.overview.waiting_publish=state.model.publish.length;
    state.model.overview.scheduled_publish=(state.model.scheduled||[]).length;
    render(state.model);
  }

  function toast(msg){
    const t=$('#toast');
    t.textContent=ownerText(msg);
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer=setTimeout(()=>t.classList.remove('show'),2600);
  }

  function showLoadError(err){
    $('#overview-loading').innerHTML=`<div class="error">${esc(ownerText((err&&err.message)||'Không tải được dữ liệu. Vui lòng thử lại.'))}</div>`;
