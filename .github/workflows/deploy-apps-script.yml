name: Deploy Apps Script Web App

on:
  push:
    branches:
      - recovery/ht-market-pr-mkt-20260825
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - 'tests/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Push source and create/update Web App deployment'
        required: true
        default: true
        type: boolean
      description:
        description: 'Deployment description'
        required: false
        default: 'HT Market Command Center deployment'
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ht-market-apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required Google credential
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub secret: CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Run source contracts
        run: |
          node tests/mobile-ux-contract.mjs
          node tests/backend-contract.mjs

      - name: Verify clasp project binding
        run: |
          test -f .clasp.json
          node -e "const c=require('./.clasp.json'); if(!c.scriptId||c.rootDir!=='apps-script') process.exit(1); console.log('Bound script:', c.scriptId.slice(0,8)+'…'+c.scriptId.slice(-6));"

      - name: Verify read access to Apps Script project
        shell: bash
        run: |
          set -uo pipefail
          rm -rf /tmp/htm-clasp-read
          mkdir -p /tmp/htm-clasp-read
          cp .clasp.json /tmp/htm-clasp-read/.clasp.json
          node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/htm-clasp-read/.clasp.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.rootDir = 'pulled';
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          NODE
          cd /tmp/htm-clasp-read
          set +e
          npx -y @google/clasp@3.4.0 pull > clasp-pull.log 2>&1
          pull_code=$?
          set -e
          cat clasp-pull.log
          cp clasp-pull.log "$GITHUB_WORKSPACE/clasp-pull.log"
          if [ "$pull_code" -ne 0 ]; then
            echo "clasp pull failed with exit code $pull_code"
            exit "$pull_code"
          fi
          test -f pulled/appsscript.json
          echo "Apps Script API read access confirmed."
          cp pulled/appsscript.json "$GITHUB_WORKSPACE/remote-appsscript.json"

      - name: Push source to Apps Script
        run: npx -y @google/clasp@3.4.0 push --force

      - name: Create or update Web App deployment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        env:
          HT_DEPLOYMENT_ID: ${{ secrets.HT_DEPLOYMENT_ID || vars.HT_DEPLOYMENT_ID }}
          DEPLOY_DESCRIPTION: ${{ inputs.description || 'HT Market Command Center preview' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$HT_DEPLOYMENT_ID" ]; then
            npx -y @google/clasp@3.4.0 create-deployment \
              --deploymentId "$HT_DEPLOYMENT_ID" \
              --description "$DEPLOY_DESCRIPTION" | tee deployment-output.txt
          else
            npx -y @google/clasp@3.4.0 create-deployment \
              --description "$DEPLOY_DESCRIPTION" | tee deployment-output.txt
          fi
          npx -y @google/clasp@3.4.0 list-deployments | tee deployments.txt
          DEPLOYMENT_ID=$(grep -Eo 'AKfy[a-zA-Z0-9_-]+' deployment-output.txt | tail -n1 || true)
          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID=$(grep -Eo 'AKfy[a-zA-Z0-9_-]+' deployments.txt | head -n1 || true)
          fi
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec" > web-app-url.txt
            cat web-app-url.txt
          else
            echo "Deployment created/updated but Web App URL could not be derived automatically." > web-app-url.txt
          fi

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'push' && hashFiles('web-app-url.txt') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('web-app-url.txt', 'utf8').trim();
            const { owner, repo } = context.repo;
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${context.ref.replace('refs/heads/','')}`
            });
            if (prs.data.length) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prs.data[0].number,
                body: `Apps Script preview deployment for \`${context.sha}\`:\n\n${url}`
              });
            }

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-deploy-${{ github.sha }}-${{ github.run_id }}
          path: |
            clasp-pull.log
            remote-appsscript.json
            deployment-output.txt
            deployments.txt
            web-app-url.txt
          if-no-files-found: warn
          retention-days: 30
