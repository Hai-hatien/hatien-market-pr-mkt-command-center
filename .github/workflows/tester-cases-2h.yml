name: Tester — five cases every 2 hours

on:
  schedule:
    - cron: '35 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ht-market-tester-five-cases-2h
  cancel-in-progress: true

env:
  TESTER_SOURCE_BRANCH: recovery/ht-market-pr-mkt-20260825

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout active development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTER_SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Capture exact target coordinate
        id: target
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${TESTER_SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static, backend and five-case contracts
        id: contracts
        shell: bash
        run: |
          set +e
          node tests/mobile-ux-contract.mjs > mobile-contract.log 2>&1
          mobile_code=$?
          node tests/backend-contract.mjs > backend-contract.log 2>&1
          backend_code=$?
          node tests/case-acceptance-contract.mjs > case-contract.log 2>&1
          case_code=$?
          cat mobile-contract.log
          cat backend-contract.log
          cat case-contract.log
          if [ "$mobile_code" -eq 0 ] && [ "$backend_code" -eq 0 ] && [ "$case_code" -eq 0 ]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Find mobile evidence for exact target commit
        id: mobile
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'mobile-ux-evidence.yml', per_page: 100 });
              const exact = runs.data.workflow_runs.find(run => run.head_sha === process.env.TARGET_SHA && run.status === 'completed');
              core.setOutput('status', exact ? (exact.conclusion === 'success' ? 'PASS' : 'FAIL') : 'NOT_EXECUTED');
              core.setOutput('run_url', exact?.html_url || '');
            } catch (error) {
              core.warning(`Không đọc được mobile evidence: ${error.message}`);
              core.setOutput('status', 'NOT_EXECUTED');
              core.setOutput('run_url', '');
            }

      - name: Find deployment evidence
        id: deploy
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'deploy-apps-script.yml', branch: process.env.TARGET_BRANCH, per_page: 100 });
              const completed = runs.data.workflow_runs.filter(run => run.status === 'completed');
              const latest = completed[0];
              const exact = completed.find(run => run.head_sha === process.env.TARGET_SHA);
              const baseline = completed.find(run => run.conclusion === 'success');
              const selected = exact || baseline;
              core.setOutput('status', exact ? (exact.conclusion === 'success' ? 'PASS' : 'FAIL') : (baseline ? 'BASELINE' : 'NOT_EXECUTED'));
              core.setOutput('sha', selected?.head_sha || '');
              core.setOutput('run_url', selected?.html_url || '');
              core.setOutput('latest_status', latest ? String(latest.conclusion || latest.status || 'UNKNOWN').toUpperCase() : 'NOT_EXECUTED');
              core.setOutput('latest_sha', latest?.head_sha || '');
              core.setOutput('latest_run_url', latest?.html_url || '');
            } catch (error) {
              core.warning(`Không đọc được deployment evidence: ${error.message}`);
              core.setOutput('status', 'NOT_EXECUTED');
              core.setOutput('sha', '');
              core.setOutput('run_url', '');
              core.setOutput('latest_status', 'NOT_EXECUTED');
              core.setOutput('latest_sha', '');
              core.setOutput('latest_run_url', '');
            }

      - name: Find previous tester report coordinate
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[TESTER] Market & PR-MKT — Báo cáo task mỗi 2 giờ';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) { core.setOutput('sha', ''); return; }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
            const latest = [issue.body || '', ...comments.map(comment => comment.body || '')].at(-1) || '';
            const match = latest.match(/Commit SHA:\s*`([0-9a-f]{40})`/i);
            core.setOutput('sha', match ? match[1] : '');

      - name: Build tester report
        env:
          TESTER_TARGET_SHA: ${{ steps.target.outputs.sha }}
          TESTER_TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TESTER_PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          TESTER_STATIC_RESULT: ${{ steps.contracts.outputs.result }}
          TESTER_MOBILE_RESULT: ${{ steps.mobile.outputs.status }}
          TESTER_MOBILE_RUN_URL: ${{ steps.mobile.outputs.run_url }}
          TESTER_DEPLOY_RESULT: ${{ steps.deploy.outputs.status }}
          TESTER_DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
          TESTER_DEPLOY_RUN_URL: ${{ steps.deploy.outputs.run_url }}
          TESTER_LATEST_DEPLOY_RESULT: ${{ steps.deploy.outputs.latest_status }}
          TESTER_LATEST_DEPLOY_SHA: ${{ steps.deploy.outputs.latest_sha }}
          TESTER_LATEST_DEPLOY_RUN_URL: ${{ steps.deploy.outputs.latest_run_url }}
          TESTER_SHEET_E2E_RESULT: ${{ vars.TESTER_SHEET_E2E_RESULT }}
          TESTER_GSC_REAL_RESULT: ${{ vars.TESTER_GSC_REAL_RESULT }}
          TESTER_DAILY_RESEARCH_RESULT: ${{ vars.TESTER_DAILY_RESEARCH_RESULT }}
          TESTER_CONTENT_UAT_RESULT: ${{ vars.TESTER_CONTENT_UAT_RESULT }}
          TESTER_RD_UAT_RESULT: ${{ vars.TESTER_RD_UAT_RESULT }}
          HT_WEB_APP_URL: ${{ secrets.HT_WEB_APP_URL || vars.HT_WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbzzAteIFxUfLAgp-PMlL4mdrHgyslnecWL5b7AmkGVJn2HSmwVMQ9K7sM6MY5S_6ces/exec' }}
          HT_DEPLOYMENT_ID: ${{ secrets.HT_DEPLOYMENT_ID || vars.HT_DEPLOYMENT_ID || 'AKfycbzzAteIFxUfLAgp-PMlL4mdrHgyslnecWL5b7AmkGVJn2HSmwVMQ9K7sM6MY5S_6ces' }}
        run: node scripts/tester-case-report.mjs

      - name: Publish report to tester issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[TESTER] Market & PR-MKT — Báo cáo task mỗi 2 giờ';
            const report = fs.readFileSync('tester-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            let issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) {
              issue = (await github.rest.issues.create({ owner, repo, title, body: 'Issue do Tester Agent quản lý. Báo cáo mới được ghi mỗi 2 giờ; không lưu secret và không coi demo là production.' })).data;
            } else if (issue.state === 'closed') {
              issue = (await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open' })).data;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: report });

      - name: Upload tester evidence
        uses: actions/upload-artifact@v4
        with:
          name: ht-market-tester-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: |
            tester-report.md
            tester-state.json
            mobile-contract.log
            backend-contract.log
            case-contract.log
          if-no-files-found: error
          retention-days: 30
